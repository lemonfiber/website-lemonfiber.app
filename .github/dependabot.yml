# Dependency updates (spec ADR-0016).
#
# One file per repo. Dependabot cannot extend a shared preset the way Renovate
# could, so this is copied rather than inherited and kept alike by review.
#
# The pull requests it opens cite nothing — Dependabot composes its own commit
# message and offers no way to add a `Spec:` trailer. `spec_check.py` supplies
# `GOV-R12` for a pull request GitHub says `dependabot[bot]` opened (Q-R55).
#
# Not configured here, deliberately:
#   - `.nvmrc`. Dependabot has no manager that reads it, and nothing else
#     watches it — see the spec's 40-quality/tooling.md, "What Dependabot does
#     not watch".
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      include: scope
    # A release waits three days before it is offered. The shared gates are
    # excluded from that wait: a repo running a stale gate is the failure this
    # grouping exists to prevent, and the delay is the whole cost of it.
    # Security updates are never subject to cooldown.
    cooldown:
      default-days: 3
      exclude: ["lemonfiber/spec*"]
    groups:
      # First match wins, so the shared gates are claimed before the wildcard.
      shared-workflows:
        patterns: ["lemonfiber/spec*"]
      # `init` and `analyze` in codeql.yml and `upload-sarif` in scorecard.yml
      # are one action published from one repository, and CodeQL refuses a run
      # whose `init` and `analyze` are different revisions of it. Offered
      # separately, each is a pull request that cannot pass until its siblings
      # land — which is what happened in `lemonfiber`, where three majors
      # arrived alone and none of them could go first.
      #
      # Majors are grouped here and for the pages pipeline below, and nowhere
      # else. The judgement is still a judgement; it is one about the action
      # rather than three that have to be made together and in step.
      codeql:
        patterns: ["github/codeql-action*"]
        update-types: ["major", "minor", "patch"]
      # The two that publish the site are one pipeline: one produces the
      # artefact, one deploys that artefact. `upload-pages-artifact` v5 moved to
      # `upload-artifact` v7, which changes what the deploy consumes, so a
      # partial upgrade is a state nobody chose — and deploy.yml runs on `main`,
      # on a schedule and on `repository_dispatch`, never on a pull request, so
      # a green check here cannot have said otherwise.
      pages:
        patterns:
          - "actions/upload-pages-artifact"
          - "actions/deploy-pages"
        update-types: ["major", "minor", "patch"]
      actions:
        patterns: ["*"]
        exclude-patterns: ["lemonfiber/spec*"]
        # Majors are left out, so each arrives on its own carrying `major`.
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Amsterdam
    labels: ["dependencies"]
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    cooldown:
      default-days: 3
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
