# Zero open SonarCloud issues (Q-R64), enforced here as in every other repo.
#
# There is no scan job: this repository is analysed by SonarCloud's Automatic
# Analysis, which posts the same summary comment a CI-driven scan would. The
# shared gate reads that comment and fails on any new issue, which is what holds
# the open count at zero — the free plan's own gate cannot be configured to that
# standard (`Q-R63`). It is enforced identically whichever way the analysis was
# produced.
#
# Without this the repository had SonarCloud's own quality gate and nothing else
# — and that gate passes with new issues on it, which is the whole reason
# `Q-R64` exists.
name: sonar

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/sonar-gate.yml@60d130a3d799e4826111f9eeffa932b733bc22c3 # v1.0.16
    # The gate defaults the key to `<owner>_<repo>`, which every other project
    # in the org is called. This one is `lemonfiber_website` — the project was
    # made before the repository was renamed — so the default resolved to
    # nothing, and a key that resolves to nothing answers every count with zero.
    # The gate said so on every run, in a warning beside a passing tick:
    #
    #   Could not read the open-issue count for lemonfiber_website-lemonfiber.app
    #   (HTTP 404), so the number Q-R64 names is not being enforced on this run.
    with:
      project: lemonfiber_website
    secrets:
      sonar-token: ${{ secrets.SONAR_TOKEN }}
