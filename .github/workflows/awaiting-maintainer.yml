# The maintainer queue flag. Triggers are declared here because a reusable
# cannot declare its caller's; the behaviour lives in the spec repo. OPS-R26, OPS-R27.
#
# The list below is also the wait list. The flag only goes up once every check
# `main` requires has passed, and the reusable reads this same list back out of
# this file to know what it must see finish first, so a workflow missing from it
# is a workflow the flag never waits for. The checks `main` requires come from
# these workflows:
#
#   gates   gates / gates
#   pin-only pin-only / pin-only
#   build   build
#   sonar   gate / gate
#   codeql  analyze (actions), analyze (javascript-typescript), alerts / alerts
#
# `SonarCloud Code Analysis` is required too and is posted by the SonarCloud app
# rather than by a workflow, so it cannot be waited for by name; `sonar`'s
# `gate / gate` reads that summary and cannot succeed before it exists.
#
# Add a workflow to branch protection and it belongs here in the same change.
name: awaiting-maintainer
on:
  # A gating workflow left out of this list can be the last one to finish, with
  # nothing afterwards to notice the pull request became mergeable — the flag
  # never goes up and nothing says why.
  workflow_run:
    workflows: [gates, pin-only, build, sonar, codeql]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [closed]
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  awaiting:
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/awaiting-maintainer.yml@179b4ba43358275e2595b4c35d7d9427f63cb3ea # v1.0.166
    secrets:
      DISCORD_MAINTAINERS_WEBHOOK: ${{ secrets.DISCORD_MAINTAINERS_WEBHOOK }}
