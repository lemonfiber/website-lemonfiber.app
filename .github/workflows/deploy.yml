# Publishes the site to GitHub Pages and to its assets-only Cloudflare Worker,
# through spec's shared `site-deploy`, which writes the worker's configuration
# from the inputs below; `wrangler.jsonc` is the same configuration for a local
# `wrangler dev`. A sibling repository asks for a rebuild through
# `rebuild-site`, which this answers.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # daily, keeps the site fresh even with no repo activity
  repository_dispatch:
    types: [rebuild-site]

permissions: {}

# One deploy at a time, and a deploy already running is never cancelled.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: lemonfiber/spec/.github/workflows/site-deploy.yml@164464d71266bdc36d90272c58eb8bd02f1ba10d # v1.0.80
    with:
      worker: website-lemonfiber
      compatibility-date: "2026-10-09"
      submodules: false
      build: |
        npm run build
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
