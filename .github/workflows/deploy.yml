# Publish to GitHub Pages — and the auto-rebuild that makes the site the org's
# mirror. Rebuilds on a daily schedule and whenever a sibling repo fires a
# `repository_dispatch` (event type: rebuild-site) after a push or release, so a
# maintainer changing the roadmap never touches this repo.
#
# Publishes to GitHub Pages (custom domain lemonfiber.app, set via public/CNAME).
# Rebuilds on: a push to main, a daily schedule, and a `repository_dispatch`
# (rebuild-site) fired by sibling repos after a push or release — so the site
# tracks the org without anyone editing this repo.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # daily, keeps the site fresh even with no repo activity
  repository_dispatch:
    types: [rebuild-site]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: a dependency's install hook would otherwise run here
      # with the job token in the environment, which is the shape most
      # supply-chain attacks take. esbuild is the only dependency in the tree
      # that declares one, and it resolves its platform binary through
      # optionalDependencies, so the build does not need it — verified by
      # building from a clean --ignore-scripts install.
      - run: npm ci --ignore-scripts
      - name: Build (fetches live org data)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
