# Publishes the site to Cloudflare, as the assets-only Worker `wrangler.jsonc`
# declares, and to GitHub Pages (custom domain lemonfiber.app, set by
# public/CNAME) while the domain still points there. Rebuilds on a push to main,
# a daily schedule, and a `repository_dispatch` (rebuild-site) fired by sibling
# repos after a push or release, so the site tracks the org without anyone
# editing this repo.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *" # daily, keeps the site fresh even with no repo activity
  repository_dispatch:
    types: [rebuild-site]

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      # --ignore-scripts: a dependency's install hook would otherwise run here
      # with the job token in the environment, which is the shape most
      # supply-chain attacks take. esbuild is the only dependency in the tree
      # that declares one, and it resolves its platform binary through
      # optionalDependencies, so the build does not need it — verified by
      # building from a clean --ignore-scripts install.
      - run: npm ci --ignore-scripts
      - name: Build (fetches live org data)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build
      # The same build, for the Cloudflare job below.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Uploads the build to the assets-only Worker `wrangler.jsonc` declares. Until
  # the organisation holds the Cloudflare secrets, the job says so and stops, so
  # a run without them publishes to GitHub Pages alone and stays green. The
  # secrets go to wrangler and to no other step.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Whether the Cloudflare secrets are set
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "set=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Cloudflare::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set, so this run published to GitHub Pages only."
          fi

      - if: steps.secrets.outputs.set == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            wrangler.jsonc
            .nvmrc
          sparse-checkout-cone-mode: false

      - if: steps.secrets.outputs.set == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - if: steps.secrets.outputs.set == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist

      - if: steps.secrets.outputs.set == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.149.0"
          command: deploy
