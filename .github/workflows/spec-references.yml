# Post/update a sticky PR comment linking this PR's cited spec identifiers to
# their defining files. Reusable lives in the spec repo. GOV-R32.
name: spec-references
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
permissions: {}
jobs:
  refs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
    uses: lemonfiber/spec/.github/workflows/spec-references.yml@44f27cb6e10a5cb38a858436d3b57c40ab63b1b7 # v1.0.30
