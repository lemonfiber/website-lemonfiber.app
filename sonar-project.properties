# The project key is immutable and predates the repo rename; SonarCloud
# tracks this repository under it and shows the current name.
sonar.projectKey=lemonfiber_website
sonar.organization=lemonfiber
sonar.sources=src,public
sonar.exclusions=dist/**,node_modules/**,.astro/**

# NOTE: this project currently runs SonarCloud Automatic Analysis, which does
# NOT honour sonar.cpd.exclusions from this file — verified empirically: the
# gate reported the same 32.4% after this file landed. Until the project is
# switched to CI-based scanning (see spec/.github/workflows/sonar-gate.yml for
# how the other repos do it), the exclusion below must ALSO be set in the
# SonarCloud UI, under Administration → Analysis Scope → Duplications. This
# file records the intent and takes effect the moment scanning moves into CI.
#
# Copy-paste detection is switched off for the locale dictionaries, because the
# duplication there is the design rather than a defect.
#
# nl.ts mirrors en.ts key for key, and pages-nl.ts mirrors pages-en.ts section
# for section. That mirroring is load-bearing: both Dutch files are typed
# against their English counterpart, so a key added on one side and forgotten on
# the other is a build error instead of a page that silently falls back. Merging
# them into one file keyed by locale would remove the duplication and remove
# that guarantee with it.
#
# seed-milestones.ts is a repetitive data literal — one object per milestone,
# each the same shape. There is no abstraction that makes it shorter without
# making it harder to read against the roadmap it mirrors.
sonar.cpd.exclusions=src/i18n/**,src/data/seed-milestones.ts
