# The project key is immutable and predates the repo rename; SonarCloud
# tracks this repository under it and shows the current name.
sonar.projectKey=lemonfiber_website
sonar.organization=lemonfiber
sonar.sources=src,public
sonar.exclusions=dist/**,node_modules/**,.astro/**

# NOTE: this project currently runs SonarCloud Automatic Analysis, which does
# NOT honour sonar.cpd.exclusions from this file — verified empirically: the
# gate reported the same 32.4% after this file landed. Until the project is
# switched to CI-based scanning (see spec/.github/workflows/sonar-gate.yml for
# how the other repos do it), the exclusion below must ALSO be set in the
# SonarCloud UI, under Administration → Analysis Scope → Duplications. This
# file records the intent and takes effect the moment scanning moves into CI.
#
# Copy-paste detection is switched off for seed-milestones.ts. It carries one
# row per milestone now rather than one object per deliverable, so it no longer
# has much to duplicate — the exclusion stays because it is a generated data
# literal and a future row is not worth a gate failure.
sonar.cpd.exclusions=src/data/seed-milestones.ts
