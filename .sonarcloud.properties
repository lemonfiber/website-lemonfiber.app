# Read by SonarQube Cloud Automatic Analysis, which is how this repository is
# scanned: `sonar.yml` runs the shared issue gate and no scan of its own, so
# there is no scanner here to read a `sonar-project.properties` — Automatic
# Analysis ignores that filename. It is the one to add alongside a
# `sonarqube-scan-action` step, the way `lemonfiber` does it.
#
# Automatic Analysis takes the project key and organisation from the repository
# binding, so neither is set here. The key is `lemonfiber_website`: it is
# immutable and predates the repo rename, and SonarQube Cloud shows the current
# name against it.
#
# `sonar.sources` is deliberately not set. Unset, the analysis covers the whole
# repository — the workflows and `scripts/` included — and naming `src` and
# `public` would take those out of it.
sonar.exclusions=dist/**,node_modules/**,.astro/**

# Copy-paste detection is switched off for seed-milestones.ts. It is a generated
# data literal, and a future row is not worth a gate failure.
sonar.cpd.exclusions=src/data/seed-milestones.ts
